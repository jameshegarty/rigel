version: 2
jobs:
  build:
    verilog:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: ls
      - run: sudo apt-get install luajit
      - run: cd examples; ls; make wrapper
      - run: test -e out/verilog_done.txt || exit
  verilator:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: sudo apt-get install luajit
      - run: wget https://www.veripool.org/ftp/verilator-4.012.tgz; tar xvzf verilator*.t*gz;cd verilator*;./configure;make -j2;sudo make install; cd ..;
      - run: cd examples; ls; make verilator
      - run: test -e out/verilator_done.txt || exit
  verilatorSOC:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: sudo apt-get install luajit
      - run: wget https://www.veripool.org/ftp/verilator-4.012.tgz; tar xvzf verilator*.t*gz;cd verilator*;./configure;make -j2;sudo make install; cd ..;
      - run: cd examples; ls; make verilatorSOC
      - run: test -e out/verilatorSOC_done.txt || exit      
  bjump:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: sudo apt-get install luajit
      - run: wget https://www.veripool.org/ftp/verilator-4.012.tgz; tar xvzf verilator*.t*gz;cd verilator*;./configure;make -j2;sudo make install; cd ..;
      - run: cd examples; ls; make bjump
      - run: test -e out/bjump_done.txt || exit      
  unit:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: sudo apt-get install luajit
      - run: sudo apt-get install verilator
      - run: cd unittests; make
  terra:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - run: wget https://github.com/zdevito/terra/releases/download/release-2016-03-25/terra-Linux-x86_64-332a506.zip
      - run: unzip terra-Linux-x86_64-332a506.zip
      - run: sudo ln -s /home/travis/build/jameshegarty/rigel/terra-Linux-x86_64-332a506/bin/terra /usr/bin/terra
      - run: cd examples; make terra
workflows:
  version: 2
  dostuff:
    jobs:
      - verilog
      - verilator
      - verilatorSOC
      - unit
      - terra